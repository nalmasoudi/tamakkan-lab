<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تمكّن | تجربة بناء الشبكة — اختيار المنافذ</title>
<style>
:root{color-scheme:light;--ink:#183045;--green:#2d846d;--pale:#ecf6f3;--border:#d5e1e7;--muted:#607786}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;margin:0;background:#f4f7f9;color:var(--ink)}button,select{font:inherit}
header{background:#182b3d;color:white;padding:18px 20px}header strong{font-size:27px}header small{display:block;color:#cbdce4;margin-top:5px}
main{max-width:1150px;margin:20px auto;padding:0 14px 35px}.card{background:white;border:1px solid var(--border);border-radius:18px;padding:15px 17px;margin-bottom:14px;box-shadow:0 2px 10px #1b354508}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
button{background:white;color:#1e4657;border:1px solid #bcd0d7;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700;min-height:42px}button.primary{background:var(--green);color:white;border-color:var(--green)}button.active{background:#dfefe9;color:#1a6c52;border:2px solid #519e84}button.warn{color:#b23e3e}button:disabled{opacity:.5;cursor:default}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:10px 0}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:7px 0}.sub:empty{display:none}
.examples{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:12px}summary{cursor:pointer;font-weight:700}.reference{width:100%;height:auto;display:block;margin:10px auto;background:white;border-radius:10px}
.viewport{width:100%;aspect-ratio:16/9;position:relative;border:1px solid #d6e3e9;border-radius:13px;background:#f8fbfc;overflow:hidden;touch-action:none;overscroll-behavior:contain;user-select:none;direction:ltr}
.stage{position:absolute;top:0;left:0;height:540px;width:940px;transform-origin:top left;background-image:linear-gradient(#e8eff366 1px,transparent 1px),linear-gradient(90deg,#e8eff366 1px,transparent 1px);background-size:27px 27px;will-change:transform}
#edges{position:absolute;inset:0;width:940px;height:540px;pointer-events:none;overflow:visible}
#nodes{position:absolute;inset:0;pointer-events:none}
.device{position:absolute;width:92px;height:78px;border:2px solid #a7c5ce;background:white;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;cursor:grab;user-select:none;touch-action:none;pointer-events:auto;box-shadow:0 1px 5px #1234;transform:translate(-50%,-50%);padding:0}
.device .symbol{font-size:28px;line-height:1.15}.device .name{font-size:13px;font-weight:800;direction:ltr}.device.selected{border-color:#368a70;background:#dff1e8}.device.await{border-color:#ce8b24;background:#fff3df}
.edge{stroke:#64868a;stroke-width:5;stroke-linecap:round;fill:none}.edge.serial{stroke:#cf6965}.edge.fiber{stroke:#16a9b1}.edge.cross{stroke:#bd8d35}.edge.invalid{stroke:#df5656;stroke-dasharray:11 6}.edge.highlighted{stroke:#176bd1;stroke-width:7}
.edge-label{font:12px monospace;fill:#315267;paint-order:stroke;stroke:#f8fbfc;stroke-width:4px;pointer-events:none}
.edge-hit{stroke:transparent;stroke-width:26;pointer-events:stroke;cursor:pointer}
#edgeAction{position:absolute;transform:translate(-50%,-50%);z-index:8;pointer-events:auto}#edgeAction button{border-color:#c96161;color:#a22e2e;background:white;min-height:42px;padding:8px 11px;font-size:14px;white-space:nowrap;box-shadow:0 4px 12px #0002}
.toolarea{margin-top:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolarea button{min-height:40px}.toolarea .danger{color:#b23e3e}.cable-choice{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}.cable-choice select{max-width:190px;width:100%;min-width:150px;background:white;border:1px solid #bcd0d7;border-radius:10px;padding:9px;color:var(--ink)}
.tools-separator{width:1px;height:31px;background:#d6e3e9;margin:0 2px}.compact-tools{display:flex;gap:7px;align-items:center}.compact-tools button{font-size:13px;padding:8px 10px}
.pill{background:#e8f3ef;border:1px solid #cbe2d9;border-radius:999px;color:#246854;padding:5px 10px;font-size:13px;font-weight:700}
.status{background:#f1f6f7;padding:12px;border-radius:12px;font-size:14px;line-height:1.9}.status .item{display:flex;gap:9px;align-items:flex-start}.mark{font-size:19px;line-height:1.4}
.overlay{position:fixed;inset:0;background:#102b37a8;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.hidden{display:none!important}.dialog{background:white;border-radius:18px;padding:22px;max-width:490px;width:100%;box-shadow:0 20px 40px #1237}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.grid label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}select{border-radius:8px;border:1px solid #9ebbc6;padding:10px;background:white;color:#183045;max-width:100%}
#modalError{color:#a94343;font-size:13px;min-height:18px}
.port-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0;max-height:43vh;overflow-y:auto;overscroll-behavior:contain}
.port-menu button{text-align:center;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;padding:14px 8px;min-height:52px;border-color:#b7d0d9}
.port-menu button:disabled{opacity:.44;background:#f0f3f5;color:#6a7e8b}
.port-menu .port-kind{display:block;font-family:system-ui,Tahoma,sans-serif;font-size:11px;color:#5e7986;margin-top:2px;direction:rtl}
.dialog .port-summary{font-size:13px;color:#3a6574;background:#edf6f4;border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.8}
@media(max-width:540px){.overlay{align-items:flex-end;padding:8px}.dialog{border-radius:18px 18px 12px 12px;max-height:88dvh;overflow:auto;padding:18px}.port-menu{max-height:48dvh}}
#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#173346;color:white;padding:11px 17px;border-radius:12px;font-size:14px;max-width:90%;display:none;z-index:99;box-shadow:0 4px 20px #0003}
@media(max-width:540px){main{margin:12px auto;padding:0 9px 25px}header{padding:15px}header strong{font-size:23px}.card{padding:12px}.sub{font-size:12px}.viewport{min-height:225px}.toolarea{gap:7px}.toolarea button{font-size:13px;padding:8px 10px}.cable-choice{width:100%}.cable-choice select{flex:1;max-width:none}.grid{grid-template-columns:1fr}.compact-tools{margin-inline-start:auto}}

</style></head>

 ['R3','Fa0/0','SW3','Fa0/1'],['SW3','Fa0/2','PC2','Fa0']];
const iconMap={router:'🌐',switch:'▤',pc:'🖥️'};
const cableNames={auto:'تلقائي',straight:'نحاسي مستقيم',cross:'نحاسي متقاطع',serial:'Serial DCE / DTE',fiber:'ألياف ضوئية'};
let nodes=[],links=[],serial=0,history=[],linkMode=false,first=null,chosen=null,selectedLink=-1,portDevice=null;
let zoom=1,panX=0,panY=0,fit=1;
const active=new Map();
let gesture=null,usedTwoFingers=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const byid=id=>nodes.find(n=>n.id===id);
const name=id=>byid(id)?.name||'؟';
function toast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2400)}
function snapshot(){history.push({nodes:structuredClone(nodes),links:structuredClone(links),serial});if(history.length>40)history.shift()}
function dirty(){result.textContent='يمكن فحص الرسم بعد الانتهاء من التوصيل.'}
function undo(){const prev=history.pop();if(!prev){toast('لا توجد خطوة للتراجع');return}nodes=prev.nodes;links=prev.links;serial=prev.serial;first=null;chosen=null;portDevice=null;modal.classList.add('hidden');selectedLink=-1;dirty();render();toast('تم التراجع')}
function portKind(p){return /^Se/.test(p)?'serial':/^SFP/.test(p)?'fiber':'copper'}
function recommended(a,b,k){if(k==='serial')return 'serial';if(k==='fiber')return 'fiber';const A=byid(a),B=byid(b);return A?.type===B?.type||((A?.type==='router'&&B?.type==='pc')||(A?.type==='pc'&&B?.type==='router'))?'cross':'straight'}
function actualCable(l){if(l.cable&&l.cable!=='auto')return l.cable;return recommended(l.a,l.b,portKind(l.ap))}
function cableValid(l){const a=byid(l.a),b=byid(l.b);if(!a||!b)return false;const k=portKind(l.ap);if(k!==portKind(l.bp))return false;const c=actualCable(l);if(k==='serial')return c==='serial'&&a.type==='router'&&b.type==='router';if(k==='fiber')return c==='fiber'&&a.type!=='pc'&&b.type!=='pc';return k==='copper'&&c===recommended(l.a,l.b,'copper')}
function used(id,p){return links.some(l=>(l.a===id&&l.ap===p)||(l.b===id&&l.bp===p))}
function available(type){const set=new Set(nodes.map(n=>n.name));const prefix=type==='router'?'R':type==='switch'?'SW':'PC';let i=type==='pc'?0:1;while(set.has(prefix+i))i++;return prefix+i}
function screenPoint(e){const r=viewport.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function toWorld(p){return {x:(p.x-panX)/zoom,y:(p.y-panY)/zoom}}
function visibleCenter(){return toWorld({x:viewport.clientWidth/2,y:viewport.clientHeight/2})}
function nextPosition(){const center=visibleCenter(); const candidates=[[0,0],[130,0],[-130,0],[0,110],[0,-110],[130,110],[-130,-110],[-130,110],[130,-110],[260,0],[-260,0],[0,210],[0,-210]];
  let best=null,score=-Infinity;
  for(const [dx,dy] of candidates){const x=clamp(center.x+dx,56,W-56),y=clamp(center.y+dy,49,H-49);
   const mind=nodes.length?Math.min(...nodes.map(n=>Math.hypot(n.x-x,n.y-y))):200;
   const p={x:x*zoom+panX,y:y*zoom+panY};
   const vis=p.x>20&&p.x<viewport.clientWidth-20&&p.y>20&&p.y<viewport.clientHeight-20;
   const s=(vis?500:0)+Math.min(250,mind)-Math.hypot(dx,dy)*0.1;
   if(s>score){best={x,y};score=s}
  }return best||{x:W/2,y:H/2}
}
function add(type){snapshot();let p=nextPosition();let newNode={id:'n'+(++serial),type,name:available(type),x:p.x,y:p.y};nodes.push(newNode);chosen=newNode.id;selectedLink=-1;dirty();render();toast('تمت إضافة '+newNode.name)}
function panBounds(){const vw=viewport.clientWidth,vh=viewport.clientHeight;const ww=W*zoom,hh=H*zoom;
 if(ww<=vw)panX=(vw-ww)/2;else panX=clamp(panX,vw-ww,0);
 if(hh<=vh)panY=(vh-hh)/2;else panY=clamp(panY,vh-hh,0)}
function view(){panBounds();stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;positionEdgeAction()}
function fitView(rescale=false){const vw=viewport.clientWidth,vh=viewport.clientHeight; if(!vw||!vh)return;
 const newFit=Math.min(vw/W,vh/H);if(!rescale||!fit)zoom=newFit;else zoom=clamp(zoom*newFit/fit,newFit,newFit*5);
 fit=newFit;panX=(vw-W*zoom)/2;panY=(vh-H*zoom)/2;view()}
function zoomAround(newZ,pt){newZ=clamp(newZ,fit,Math.max(fit*5,1));let anchor=toWorld(pt);zoom=newZ;panX=pt.x-anchor.x*zoom;panY=pt.y-anchor.y*zoom;view()}
function setLinkMode(val){linkMode=val;first=null;chosen=null;portDevice=null;modal.classList.add('hidden');selectedLink=-1;$('linkmode').classList.toggle('active',val);
 $('linkmode').setAttribute('aria-pressed',String(val));hint.textContent=val?'اضغط على الجهاز الأول واختر منفذه.':'';render()}
function render(){nbox.replaceChildren();for(const n of nodes){const el=document.createElement('button');el.type='button';el.className='device'+(chosen===n.id?' selected':'')+(first?.id===n.id?' await':'');el.dataset.id=n.id;
 el.style.left=n.x+'px';el.style.top=n.y+'px';el.setAttribute('aria-label',`${n.name}، ${n.type==='router'?'راوتر':n.type==='switch'?'سويتش':'حاسب'}`);
 const sym=document.createElement('span');sym.className='symbol';sym.textContent=iconMap[n.type];const label=document.createElement('span');label.className='name';label.textContent=n.name;el.append(sym,label);el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&linkMode){e.preventDefault();chooseEndpoint(n.id)}});nbox.append(el)}renderLinks()}
function positionEdgeAction(){if(selectedLink<0||selectedLink>=links.length){edgeAction.classList.add('hidden');return}
 const l=links[selectedLink],a=byid(l.a),b=byid(l.b);if(!a||!b){edgeAction.classList.add('hidden');return}
 const x=panX+(a.x+b.x)/2*zoom,y=panY+(a.y+b.y)/2*zoom+27;
 edgeAction.classList.remove('hidden');edgeAction.style.left=clamp(x,70,viewport.clientWidth-70)+'px';edgeAction.style.top=clamp(y,25,viewport.clientHeight-25)+'px';}
function renderLinks(){svg.replaceChildren();const ns='http://www.w3.org/2000/svg';let position=null;
 links.forEach((l,i)=>{const a=byid(l.a),b=byid(l.b);if(!a||!b)return;
 const line=document.createElementNS(ns,'line');for(const [key,v] of Object.entries({x1:a.x,y1:a.y,x2:b.x,y2:b.y}))line.setAttribute(key,v);
 line.setAttribute('class','edge '+(portKind(l.ap)==='serial'?'serial':portKind(l.ap)==='fiber'?'fiber':actualCable(l)==='cross'?'cross':'')+(cableValid(l)?'':' invalid')+(i===selectedLink?' highlighted':''));svg.append(line);
 const middle={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 const label=document.createElementNS(ns,'text');label.setAttribute('class','edge-label');label.setAttribute('x',middle.x);label.setAttribute('y',middle.y-13);label.setAttribute('text-anchor','middle');label.textContent=l.ap+' ↔ '+l.bp;svg.append(label);
 const hit=document.createElementNS(ns,'line');for(const [key,v] of Object.entries({x1:a.x,y1:a.y,x2:b.x,y2:b.y}))hit.setAttribute(key,v);hit.setAttribute('class','edge-hit');hit.setAttribute('role','button');hit.setAttribute('aria-label','تحديد الوصلة بين '+a.name+' و'+b.name);
 hit.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selectedLink=i;chosen=null;first=null;render();});svg.append(hit);
 if(i===selectedLink)position=middle;
 });
 positionEdgeAction();
}
function chooseEndpoint(id){
 if(first?.id===id){toast('اختر الجهاز الثاني للتوصيل');return}
 portDevice=id;renderPortMenu();modal.classList.remove('hidden');
}
function selectedCableKind(){const c=$('defaultCable').value;return c==='serial'?'serial':c==='fiber'?'fiber':c==='auto'?'auto':'copper'}
function renderPortMenu(){
 const dev=byid(portDevice);if(!dev)return;
 const second=Boolean(first), selected=$('defaultCable').value,kind=selectedCableKind();
 $('portTitle').textContent=(second?'اختر منفذ الجهاز الثاني: ':'اختر منفذ الجهاز الأول: ')+dev.name;
 $('connames').textContent=second?name(first.id)+' ('+first.port+') ← '+dev.name+'  •  '+cableNames[selected]:dev.name+'  •  '+cableNames[selected];
 const wrapper=$('portButtons');wrapper.replaceChildren();let eligible=0;
 for(const p of portList[dev.type]){
  const isUsed=used(dev.id,p),pk=portKind(p);
  const mismatch=(kind!=='auto'&&pk!==kind)||(second&&pk!==portKind(first.port));
  const button=document.createElement('button');button.type='button';button.textContent=p;
  button.disabled=isUsed||mismatch;
  button.setAttribute('aria-label',p+(isUsed?' منفذ مستخدم':mismatch?' غير متوافق':''));
  const help=document.createElement('span');help.className='port-kind';help.textContent=isUsed?'مستخدم':mismatch?'غير متوافق':pk==='serial'?'Serial':pk==='fiber'?'Fiber':'Ethernet';
  button.append(help);
  if(!button.disabled){eligible++;button.addEventListener('click',()=>selectEndpointPort(dev.id,p))}
  wrapper.append(button);
 }
 $('modalError').textContent=eligible?'':second?'لا يوجد منفذ متاح ومتوافق في هذا الجهاز.':'لا توجد منافذ مناسبة للكابل المحدد. غيّر نوع الكابل من الشريط أسفل مساحة العمل.';
}
function selectEndpointPort(id,port){
 if(!linkMode||portDevice!==id||used(id,port))return;
 const kind=selectedCableKind();
 if(kind!=='auto'&&portKind(port)!==kind)return;
 if(!first){first={id,port};chosen=id;modal.classList.add('hidden');portDevice=null;selectedLink=-1;
  hint.textContent='اختر الجهاز الثاني ومنفذه.';render();return}
 if(first.id===id){toast('اختر جهازًا آخر');return}
 const a=first.id,ap=first.port,b=id,bp=port;
 if(portKind(ap)!==portKind(bp)){$('modalError').textContent='المنفذان من نوعين مختلفين.';return}
 if(portKind(ap)==='serial'&&(byid(a).type!=='router'||byid(b).type!=='router')){$('modalError').textContent='Serial للتوصيل بين الراوترات فقط.';return}
 if(portKind(ap)==='fiber'&&(byid(a).type==='pc'||byid(b).type==='pc')){$('modalError').textContent='الجهاز لا يدعم توصيل Fiber.';return}
 const selected=$('defaultCable').value,c=selected==='auto'?recommended(a,b,portKind(ap)):selected;
 snapshot();links.push({a,b,ap,bp,cable:c});first=null;chosen=null;portDevice=null;selectedLink=links.length-1;modal.classList.add('hidden');dirty();render();
 hint.textContent='تم التوصيل. اختر الجهاز الأول لوصلة جديدة.';
 toast(cableValid(links[links.length-1])?'تم توصيل '+name(a)+' مع '+name(b):'تمت الوصلة؛ نوع الكابل غير مناسب');
}
function closeModal(){modal.classList.add('hidden');portDevice=null;render()}
function removeLink(){if(selectedLink<0||selectedLink>=links.length)return;snapshot();links.splice(selectedLink,1);selectedLink=-1;dirty();render();toast('حُذفت الوصلة، والمنافذ متاحة الآن')}
function beginGesture(e){if(e.button!==0)return;if(e.target.closest('#edgeAction'))return;
 const pt=screenPoint(e);let device=e.target.closest('.device');active.set(e.pointerId,pt);
 try{viewport.setPointerCapture(e.pointerId)}catch(_e){}
 if(active.size===1){usedTwoFingers=false;gesture={id:e.pointerId,device:device?.dataset.id||null,x:pt.x,y:pt.y,originX:panX,originY:panY,moved:false,saved:false};}
 else if(active.size===2){usedTwoFingers=true;gesture=null;const [a,b]=[...active.values()];const center={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 viewport._pinch={distance:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),zoom,centerWorld:toWorld(center)};
 }
 e.preventDefault();
}
function pointerMove(e){if(!active.has(e.pointerId))return;const pt=screenPoint(e);active.set(e.pointerId,pt);
 if(active.size>=2&&viewport._pinch){const [a,b]=[...active.values()];const center={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 zoom=clamp(viewport._pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/viewport._pinch.distance,fit,Math.max(fit*5,1));
 panX=center.x-viewport._pinch.centerWorld.x*zoom;panY=center.y-viewport._pinch.centerWorld.y*zoom;view();return}
 const g=gesture;if(!g||g.id!==e.pointerId)return;
 const dx=pt.x-g.x,dy=pt.y-g.y;if(Math.hypot(dx,dy)>5)g.moved=true;
 if(!g.moved)return;
 if(g.device){const node=byid(g.device);if(!node)return;
  if(!g.saved){snapshot();g.saved=true}
  // احتفظ بإحداثيات الجهاز قبل السحب حتى لا يتراكم فرق الحركة.
  if(g.baseX===undefined){g.baseX=node.x;g.baseY=node.y}
  node.x=clamp(g.baseX+dx/zoom,52,W-52);node.y=clamp(g.baseY+dy/zoom,47,H-47);
  const el=nbox.querySelector('[data-id="'+CSS.escape(node.id)+'"]');if(el){el.style.left=node.x+'px';el.style.top=node.y+'px'}renderLinks();dirty();
 }else{panX=g.originX+dx;panY=g.originY+dy;view()}
}
function pointerEnd(e){if(!active.has(e.pointerId))return;active.delete(e.pointerId);
 if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);
 if(viewport._pinch){if(active.size<2){viewport._pinch=null;gesture=null;}return}
 const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;
 if(!g.moved&&!usedTwoFingers){if(g.device){if(linkMode)chooseEndpoint(g.device);else{chosen=g.device;selectedLink=-1;render()}}else{chosen=null;selectedLink=-1;render()}}
 else if(g.moved&&g.device){chosen=g.device;selectedLink=-1;render()}
}
function normalized(a,ap,b,bp){return [[a,ap],[b,bp]].sort((x,y)=>x[0].localeCompare(y[0])||x[1].localeCompare(y[1])).flat().join('|')}
function check(){const correct=new Set(expected.map(e=>normalized(...e)));
 const matching=links.filter(l=>correct.has(normalized(name(l.a),l.ap,name(l.b),l.bp))&&cableValid(l)).length;
 const names=new Set(nodes.map(n=>n.name)),count=new Set(expected.flatMap(e=>[e[0],e[2]])).size,there=[...new Set(expected.flatMap(e=>[e[0],e[2]]))].filter(n=>names.has(n)).length;
 const bad=links.filter(l=>!cableValid(l)).length;
 const extras=links.length-matching;
 const rows=[['الأجهزة المطلوبة',`${there} من ${count}`,there===count],['الوصلات الصحيحة بالمنافذ والكابلات',`${matching} من ${expected.length}`,matching===expected.length],['وصلات زائدة أو غير مطابقة',String(extras),extras===0],['وصلات ذات كابلات غير مناسبة',String(bad),bad===0]];
 result.replaceChildren();for(const [t,v,ok] of rows){const line=document.createElement('div');line.className='item';const mark=document.createElement('span');mark.className='mark';mark.textContent=ok?'✓':'○';const words=document.createElement('span');words.textContent=t+': ';const b=document.createElement('b');b.textContent=v;words.append(b);line.append(mark,words);result.append(line)}
 const note=document.createElement('div');note.className='sub';note.textContent='الفحص للرسم والمنافذ والكابلات فقط، ولا يشمل أوامر Cisco أو إعدادات IP.';result.append(note)}
function save(){const blob=new Blob([JSON.stringify({kind:'tamakkan-network-builder-demo',version:2,nodes,links},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='Tamakkan_network_drawing.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('حُفظ الرسم على جهازك')}
function load(file){const fr=new FileReader();fr.onload=()=>{try{
 const raw=JSON.parse(fr.result);if(raw.kind!=='tamakkan-network-builder-demo'||![1,2].includes(raw.version)||!Array.isArray(raw.nodes)||!Array.isArray(raw.links)||raw.nodes.length>70||raw.links.length>140)throw Error();
 const ids=new Set(),names=new Set(),busy=new Set();
 for(const n of raw.nodes){if(!['router','switch','pc'].includes(n.type)||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]{1,24}$/.test(n.id)||typeof n.name!=='string'||n.name.length>24||!Number.isFinite(n.x)||!Number.isFinite(n.y)||ids.has(n.id)||names.has(n.name))throw Error();ids.add(n.id);names.add(n.name)}
 for(const l of raw.links){const a=raw.nodes.find(n=>n.id===l.a),b=raw.nodes.find(n=>n.id===l.b);if(!a||!b||a.id===b.id||!portList[a.type].includes(l.ap)||!portList[b.type].includes(l.bp)||!['auto','straight','cross','serial','fiber',undefined].includes(l.cable))throw Error();if(busy.has(l.a+':'+l.ap)||busy.has(l.b+':'+l.bp))throw Error();busy.add(l.a+':'+l.ap);busy.add(l.b+':'+l.bp)}
 snapshot();nodes=raw.nodes.map(n=>({...n,x:clamp(n.x,52,W-52),y:clamp(n.y,47,H-47)}));links=raw.links.map(l=>({...l,cable:l.cable||'auto'}));serial=nodes.reduce((m,n)=>Math.max(m,Number(n.id.replace(/^n/,''))||0),0);first=null;chosen=null;portDevice=null;selectedLink=-1;setLinkMode(false);dirty();render();fitView();toast('استُعيد الرسم المحفوظ')
 }catch(_){toast('الملف غير صالح لهذه التجربة')}};fr.readAsText(file)}
// الأدوات
for(const el of document.querySelectorAll('[data-add]'))el.addEventListener('click',()=>add(el.dataset.add));
$('linkmode').addEventListener('click',()=>setLinkMode(!linkMode));$('undo').addEventListener('click',undo);
$('clear').addEventListener('click',()=>{if(confirm('مسح الرسم الحالي؟')){snapshot();nodes=[];links=[];selectedLink=-1;first=null;chosen=null;portDevice=null;modal.classList.add('hidden');dirty();render();toast('مُسح الرسم')}});
$('deleteEdge').addEventListener('click',removeLink);
$('check').addEventListener('click',check);$('cancelLink').addEventListener('click',closeModal);
// لا نغلق نافذة المنافذ بالنقر على الخلفية لأن لمسات الجوال قد تولّد ضغطة متأخرة عند فتح النافذة.
$('export').addEventListener('click',save);$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);e.target.value=''});
$('defaultCable').addEventListener('change',()=>{first=null;chosen=null;portDevice=null;modal.classList.add('hidden');if(linkMode)hint.textContent='اختر الجهاز الأول ومنفذه.';render()});
viewport.addEventListener('pointerdown',beginGesture);viewport.addEventListener('pointermove',pointerMove);viewport.addEventListener('pointerup',pointerEnd);viewport.addEventListener('pointercancel',pointerEnd);
viewport.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const p=screenPoint(e);zoomAround(zoom*(e.deltaY>0?0.9:1.1),p)},{passive:false});
$('fitView').addEventListener('click',()=>fitView());
new ResizeObserver(()=>{if(viewport.clientWidth>0)fitView(true)}).observe(viewport);
requestAnimationFrame(()=>{fitView();render();setLinkMode(false)});
})();

</script>
</body></html>
